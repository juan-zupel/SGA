          <section class="formulario-2">
        <h2>Alta de Docente</h2>
        <form id="formDocente">
          <label for="nombreD">Nombre</label>
          <input type="text" id="nombreD" /><br /><br />

          <label for="especialidad">Especialidad</label>
          <input type="text" id="especialidad" /><br /><br />

          <label for="correoD">Correo</label>
          <input type="text" id="correoD" /><br /><br />

          <button type="submit">Registrar Docente</button>
        </form>
        <p id="mensaje" class="oculto"></p>
      </section>

      <section class="docentes">
        <h2>Docentes Registrados</h2>
        <p id="cantidaddocentes"></p>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Especialidad</th>
              <th>Correo</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="listaDocentes">

          </tbody>
        </table>
      </section>
    </main>
